[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-manager"
version = "0.1.0"
description = "Defense-only merchant risk ingestion foundation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pytest>=7.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "shap>=0.45",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["risk_manager*"]